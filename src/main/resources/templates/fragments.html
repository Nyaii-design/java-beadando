<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Közös <head>: Bootswatch "Flatly" ingyenes reszponzív téma (Bootstrap 5) -->
<head th:fragment="head(cim)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${cim} + ' – Java beadandó'">Java beadandó</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/sajat.css}">
</head>

<!-- Felső menüsor -->
<nav th:fragment="menu(aktiv)" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="bi bi-currency-exchange"></i> DevizaPont</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#fomenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="fomenu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'fooldal'} ? active" th:href="@{/}">Főoldal</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'soap'} ? active" th:href="@{/soap}">SOAP</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'account'} ? active" th:href="@{/forex/account}">Forex-account</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'aktar'} ? active" th:href="@{/forex/aktar}">Forex-AktÁr</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'histar'} ? active" th:href="@{/forex/histar}">Forex-HistÁr</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'nyit'} ? active" th:href="@{/forex/nyit}">Forex-Nyit</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'poz'} ? active" th:href="@{/forex/poz}">Forex-Poz</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${aktiv == 'zar'} ? active" th:href="@{/forex/zar}">Forex-Zár</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hibaüzenet doboz -->
<div th:fragment="hiba" th:if="${hiba}" class="alert alert-danger">
    <i class="bi bi-exclamation-triangle"></i> <span th:text="${hiba}">Hiba</span>
</div>

<!-- Lábléc: készítők neve és Neptun-kódja minden oldalon -->
<footer th:fragment="lablec" class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
        <div>Készítették: <strong th:text="${keszitok}">Név (NEPTUN)</strong></div>
        <small class="text-secondary">Java alkalmazások – előadás beadandó · NJE GAMF · 2026</small>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
