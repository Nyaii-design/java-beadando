<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forex-account')}"></head>
<body>
<nav th:replace="~{fragments :: menu('account')}"></nav>

<main class="container">
    <h2 class="oldal-cim"><i class="bi bi-wallet2"></i> Forex-account – számlainformációk</h2>
    <div th:replace="~{fragments :: hiba}"></div>

    <div th:if="${adatok}" class="card"><div class="card-body">
        <table class="table table-hover mb-0">
            <tbody>
            <tr th:each="e : ${adatok}">
                <th style="width: 40%" th:text="${e.key}"></th>
                <td th:text="${e.value}"></td>
            </tr>
            </tbody>
        </table>
    </div></div>
</main>

<footer th:replace="~{fragments :: lablec}"></footer>
</body>
</html>
