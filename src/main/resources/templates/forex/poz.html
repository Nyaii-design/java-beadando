<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forex-Poz')}"></head>
<body>
<nav th:replace="~{fragments :: menu('poz')}"></nav>

<main class="container">
    <h2 class="oldal-cim"><i class="bi bi-list-ul"></i> Forex-Poz – nyitott pozíciók</h2>
    <div th:replace="~{fragments :: hiba}"></div>

    <div th:if="${tradek != null and tradek.isEmpty()}" class="alert alert-info">Jelenleg nincs nyitott pozíció.</div>

    <div th:if="${tradek != null and !tradek.isEmpty()}" class="card"><div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead>
                <tr><th>tradeId</th><th>Instrumentum</th><th>Irány</th><th>Mennyiség</th><th>Nyitóár</th><th>Nyitás ideje</th><th>Nem realizált P/L</th></tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tradek}">
                    <td><strong th:text="${t.id}"></strong></td>
                    <td th:text="${t.instrument}"></td>
                    <td>
                        <span th:if="${t.currentUnits.doubleValue() > 0}" class="badge bg-success">Long</span>
                        <span th:unless="${t.currentUnits.doubleValue() > 0}" class="badge bg-danger">Short</span>
                    </td>
                    <td th:text="${t.currentUnits}"></td>
                    <td th:text="${t.price}"></td>
                    <td th:text="${t.openTime}"></td>
                    <td th:text="${t.unrealizedPL}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div></div>
    <p class="mt-3"><a th:href="@{/forex/zar}" class="btn btn-outline-danger"><i class="bi bi-x-circle"></i> Pozíció zárása</a></p>
</main>

<footer th:replace="~{fragments :: lablec}"></footer>
</body>
</html>
